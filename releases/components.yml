# ChurchBridge component manifest
#
# Records the reviewed commit of each component for a named product release.
#
# This is a DOCUMENTATION MANIFEST, not a submodule lockfile. Nothing reads it
# at build or deploy time. The platform and the iOS app have independent release
# cycles; this file states which commits were verified to work together, so that
# a reported issue can be traced to a known combination.
#
# Add a new entry per named release. Do not rewrite history in this file.

schema_version: 1

releases: []
# Template for the first named release — fill in once the components below have
# been reviewed, tested together, and published:
#
#   - name: "2026.1"
#     date: 2026-00-00
#     status: draft            # draft | released | superseded
#     notes: >
#       One or two sentences on what this release changes for a church running
#       it, in plain language.
#     components:
#       platform:
#         repository: https://github.com/hainesdev/churchbridge-platform
#         ref: main
#         commit: "0000000000000000000000000000000000000000"
#       ios:
#         repository: https://github.com/hainesdev/churchbridge-ios
#         ref: main
#         commit: "0000000000000000000000000000000000000000"

# Current development state, recorded for reference only. These are NOT a
# release and have not been through the publication review.
#
# Note: the platform repository's history was rewritten on 2026-09-05 to remove
# third-party media, so every commit before that point has a new SHA. Any older
# reference to a platform commit will not resolve.
